<svg id="authdiagram1" width="100%" xmlns="http://www.w3.org/2000/svg" class="statediagram" style="max-width: 175px;" viewBox="0 0 175 260" role="graphics-document document" aria-roledescription="stateDiagram"><style>#authdiagram1{font-family:Microsoft YaHei,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#authdiagram1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#authdiagram1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#authdiagram1 .error-icon{fill:#552222;}#authdiagram1 .error-text{fill:#552222;stroke:#552222;}#authdiagram1 .edge-thickness-normal{stroke-width:1px;}#authdiagram1 .edge-thickness-thick{stroke-width:3.5px;}#authdiagram1 .edge-pattern-solid{stroke-dasharray:0;}#authdiagram1 .edge-thickness-invisible{stroke-width:0;fill:none;}#authdiagram1 .edge-pattern-dashed{stroke-dasharray:3;}#authdiagram1 .edge-pattern-dotted{stroke-dasharray:2;}#authdiagram1 .marker{fill:#666;stroke:#666;}#authdiagram1 .marker.cross{stroke:#666;}#authdiagram1 svg{font-family:Microsoft YaHei,sans-serif;font-size:16px;}#authdiagram1 p{margin:0;}#authdiagram1 defs [id$="-barbEnd"]{fill:#000;stroke:#000;}#authdiagram1 g.stateGroup text{fill:#999;stroke:none;font-size:10px;}#authdiagram1 g.stateGroup text{fill:#000000;stroke:none;font-size:10px;}#authdiagram1 g.stateGroup .state-title{font-weight:bolder;fill:#111111;}#authdiagram1 g.stateGroup rect{fill:#eee;stroke:#999;}#authdiagram1 g.stateGroup line{stroke:#666;stroke-width:1;}#authdiagram1 .transition{stroke:#000;stroke-width:1;fill:none;}#authdiagram1 .stateGroup .composit{fill:#ffffff;border-bottom:1px;}#authdiagram1 .stateGroup .alt-composit{fill:#e0e0e0;border-bottom:1px;}#authdiagram1 .state-note{stroke:#999;fill:#666;}#authdiagram1 .state-note text{fill:#fff;stroke:none;font-size:10px;}#authdiagram1 .stateLabel .box{stroke:none;stroke-width:0;fill:#eee;opacity:0.5;}#authdiagram1 .edgeLabel .label rect{fill:#eee;opacity:0.5;}#authdiagram1 .edgeLabel{background-color:white;text-align:center;}#authdiagram1 .edgeLabel p{background-color:white;}#authdiagram1 .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#authdiagram1 .edgeLabel .label text{fill:#000000;}#authdiagram1 .label div .edgeLabel{color:#000000;}#authdiagram1 .stateLabel text{fill:#111111;font-size:10px;font-weight:bold;}#authdiagram1 .node circle.state-start{fill:#222;stroke:#222;}#authdiagram1 .node .fork-join{fill:#222;stroke:#222;}#authdiagram1 .node circle.state-end{fill:hsl(0, 0%, 83.3333333333%);stroke:#ffffff;stroke-width:1.5;}#authdiagram1 .end-state-inner{fill:#ffffff;stroke-width:1.5;}#authdiagram1 .node rect{fill:#eee;stroke:#000;stroke-width:1px;}#authdiagram1 .node polygon{fill:#eee;stroke:#000;stroke-width:1px;}#authdiagram1 [id$="-barbEnd"]{fill:#666;}#authdiagram1 .statediagram-cluster rect{fill:#eee;stroke:#000;stroke-width:1px;}#authdiagram1 .cluster-label,#authdiagram1 .nodeLabel{color:#111111;}#authdiagram1 .statediagram-cluster rect.outer{rx:5px;ry:5px;}#authdiagram1 .statediagram-state .divider{stroke:#000;}#authdiagram1 .statediagram-state .title-state{rx:5px;ry:5px;}#authdiagram1 .statediagram-cluster.statediagram-cluster .inner{fill:#ffffff;}#authdiagram1 .statediagram-cluster.statediagram-cluster-alt .inner{fill:#f4f4f4;}#authdiagram1 .statediagram-cluster .inner{rx:0;ry:0;}#authdiagram1 .statediagram-state rect.basic{rx:5px;ry:5px;}#authdiagram1 .statediagram-state rect.divider{stroke-dasharray:10,10;fill:#f4f4f4;}#authdiagram1 .note-edge{stroke-dasharray:5;}#authdiagram1 .statediagram-note rect{fill:#666;stroke:#999;stroke-width:1px;rx:0;ry:0;}#authdiagram1 .statediagram-note rect{fill:#666;stroke:#999;stroke-width:1px;rx:0;ry:0;}#authdiagram1 .statediagram-note text{fill:#fff;}#authdiagram1 .statediagram-note .nodeLabel{color: