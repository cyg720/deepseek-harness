# 停用 Web bundle 的全部 QS 呈现插件，保留官方界面与唯一业务服务。
# 临时使用：pnpm dsh --profile web --patch ./qishu/dev-components/switch/02-disable-qs-rows.patch.yml
# 仅用于 Web profile；不要放入对所有 profile 生效的全局配置。
# 目录选择器还会动态追加 QS 插件，必须同时清空附加名单；官方目录后端及呈现仍保留。
- id: directory-picker
  config:
    additionalClientSurfaces:
      native: []
      browse: []

# 下列行对应当前 Web bundle 的全部 QS 顶层插件；新增插件时须同步回退清单和浏览器验收。
