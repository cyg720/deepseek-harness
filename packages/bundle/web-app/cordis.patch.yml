    - id: qs-ui-sidebar
      name: '@deepseek-ai/dsh-qs-ui-sidebar'
    - id: qs-ui-sidebar-right
      name: '@deepseek-ai/dsh-qs-ui-sidebar-right'
    - id: qs-sessions
